<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Profesores</title>
    <link rel="stylesheet" href="login_Profesores.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <h1>Bienvenido, Profesor</h1>
            <p>Inicia sesión para acceder al sistema</p>
            <div class="input-group">
                <label for="email">Correo Institucional</label>
                <input type="email" id="email" name="email" placeholder="ejemplo@institucion.edu.mx" required>
            </div>
            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="********" required>
            </div>
            <a href="vista_Profesor.html" class="btn-login">Iniciar Sesión</a>
        </div>
    </div>
</body>
</html>
